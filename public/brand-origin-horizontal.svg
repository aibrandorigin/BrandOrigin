<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
      .bo-h-title {
        font-family: 'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        fill: #FFFFFF;
        font-size: 32px;
        letter-spacing: 0.18em;
      }
      .bo-h-tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        fill: #B0B0B0;
        font-size: 11px;
        letter-spacing: 0.26em;
      }
      .bo-h-dot {
        fill: #E31B23;
        font-weight: 800;
      }
    </style>

    <linearGradient id="boh-metallic" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#ECECEC" />
      <stop offset="40%" stop-color="#D2D2D2" />
      <stop offset="65%" stop-color="#FAFAFA" />
      <stop offset="85%" stop-color="#BDBDBD" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>

    <linearGradient id="boh-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#666666" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#333333" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="boh-crimson" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FF424A" />
      <stop offset="40%" stop-color="#E31B23" />
      <stop offset="75%" stop-color="#AC0B11" />
      <stop offset="100%" stop-color="#6B0307" />
    </radialGradient>

    <linearGradient id="boh-laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E31B23" stop-opacity="0.6" />
    </linearGradient>

    <filter id="boh-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Scaled Emblem on Left (Height 76px, ratio 214/240 -> width ~68px) -->
  <g transform="translate(14, 12) scale(0.316)">
    <!-- Monogram body -->
    <g filter="url(#boh-shadow)">
      <path
        d="M 45 32 A 14 14 0 0 1 73 32 L 73 86.15 A 62 62 0 0 1 155.52 176.60 L 134.39 159.79 A 35 35 0 1 0 128.79 165.39 L 145.60 186.52 A 62 62 0 0 1 45 138 L 45 32 Z"
        fill="url(#boh-metallic)"
      />
      <path
        d="M 45 32 A 14 14 0 0 1 73 32 L 73 86.15 A 62 62 0 0 1 155.52 176.60 L 134.39 159.79 A 35 35 0 1 0 128.79 165.39 L 145.60 186.52 A 62 62 0 0 1 45 138 L 45 32 Z"
        stroke="url(#boh-bevel)"
        stroke-width="1.4"
        stroke-linejoin="round"
        fill="none"
      />
      <line x1="134.39" y1="159.79" x2="155.52" y2="176.60" stroke="url(#boh-laser)" stroke-width="1.4" />
      <line x1="128.79" y1="165.39" x2="145.60" y2="186.52" stroke="url(#boh-laser)" stroke-width="1.4" />
    </g>

    <!-- Center Crimson Disc -->
    <g>
      <circle cx="107" cy="138" r="20.5" fill="url(#boh-crimson)" />
      <circle cx="107" cy="138" r="20.5" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none" />
      <ellipse cx="101.5" cy="132.5" rx="8" ry="5.5" transform="rotate(-25 101.5 132.5)" fill="#FFFFFF" opacity="0.45" />
      <circle cx="107" cy="138" r="5" fill="#FFFFFF" opacity="0.85" />
    </g>
  </g>

  <!-- Horizontal Typography -->
  <text x="100" y="52" class="bo-h-title">BRAND ORIGIN</text>
  <text x="102" y="74" class="bo-h-tagline">
    BUILD <tspan class="bo-h-dot">•</tspan> INNOVATE <tspan class="bo-h-dot">•</tspan> GROW
  </text>
</svg>
